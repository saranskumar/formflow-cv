<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FormFlow: sketch and build 3D with your hands</title>
  <meta name="description" content="Sketch 3D scenes in the air with your hands, or turn front, side and top photos into a 3D model. Runs in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231473E6%27/%3E%3Cpath d=%27M9 22V10h14M9 16h9%27 stroke=%27white%27 stroke-width=%273.2%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
  <meta name="theme-color" content="#E9EAEC">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <noscript><p style="font:16px system-ui;padding:24px">FormFlow needs JavaScript. Open it in Chrome or Edge.</p></noscript>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>
  <canvas id="overlay"></canvas>
  <div id="hud"></div>
  <div id="guide" class="modal" role="dialog" aria-modal="true" aria-label="FormFlow guide"></div>
  <div id="dropzone"><div>Drop a <b>.obj</b> or <b>.stl</b> model to import it, or a <b>photo</b> onto a view in 3-Plane Hull</div></div>
  <input type="file" id="file" accept=".obj,.stl" aria-label="Import a 3D model" hidden>
  <script type="module" src="js/main.js"></script>
</body>
</html>
