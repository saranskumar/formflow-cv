[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "formflow"
version = "0.1.0"
description = "Webcam-based rapid 3D prototyping and visual hull reconstruction using hand gestures"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
formflow = "formflow.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
